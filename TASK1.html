<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <style>
        body 
        {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-size: cover;
            background-position: center;
            height: 100%;
        }

        header 
        {
            background-color: rgba(2, 82, 82, 0.8);
            color: rgb(255, 252, 252);
            padding: 10px 20px;
        }

        nav ul 
        {
            list-style-type: none;
            padding: 0;
        }

        nav ul li 
        {
            display: inline;
            margin-right: 15px;
        }

        a 
        {
            text-decoration: none;
            color: rgb(2, 2, 21);
            transition: color 0.3s;
        }

        a:hover 
        {
            color: red;
        }

        a:active 
        {
            color: red;
        }

        main 
        {
            padding: 20px;
        }

        .responsive-image 
        {
            width: 95.4vw;
            height: 100vh;
            object-fit: fill;
            display: block;
        }

        footer 
        {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 5px 0;
        }

        @media (max-width: 768px) 
        {
            nav ul 
            {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            nav ul li 
            {
                display: block;
                margin: 10px 0;
            }

            header 
            {
                text-align: center;
            }
        }

        @media (max-width: 480px) 
        {
            header h1 
            {
                font-size: 24px;
            }

            main 
            {
                padding: 10px;
            }

            footer 
            {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <header>
        <center>
            <h1><b>WELCOME TO MY PROFILE</b></h1>
            <nav>
                <ul>
                    <li><a href="home1.html">Home</a></li>
                    <li><a href="about1.html">About</a></li>
                    <li><a href="summary1.html">Summary</a></li>
                    <li><a href="contact1.html">Contact</a></li>
                </ul>
            </nav>
        </center>
    </header>
    <main>
        <section>
            <img src="https://sciencesensei.com/wp-content/uploads/2021/10/website.jpg" alt="Image"
                class="responsive-image">
        </section>
    </main>
    <footer>
        <center>
            <p>&copy; 2025 My Responsive Website</p>
        </center>
    </footer>
</body>

</html>
